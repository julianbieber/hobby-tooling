[package]
name = "hcoord"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The coordinator's task list: a ratatui view of tasks.json, and a blocking wait on a task's pipeline state."

[[bin]]
name = "hcoord"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
