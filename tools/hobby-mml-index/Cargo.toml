[package]
name = "hobby-mml-index"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Generate index.md for a repository of MML (.mml) specs"

[dependencies]
mml-parser = { path = "../../lsps/hobby-mml-lsp/mml-parser", package = "hobby-mml-parser" }

[[bin]]
name = "hobby-mml-index"
path = "src/main.rs"

[profile.release]
strip = true
