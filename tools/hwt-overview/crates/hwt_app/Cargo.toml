[package]
name = "hwt_app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "A Bevy desktop overview of hobby git-worktree dev tasks."

[[bin]]
name = "hwt-overview"
path = "src/main.rs"

[dependencies]
bevy.workspace = true
bevy_feathers.workspace = true
bevy_ui_widgets.workspace = true
feathers_kit = { path = "../feathers_kit" }
hwt_core = { path = "../hwt_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
