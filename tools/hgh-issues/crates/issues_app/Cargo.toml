[package]
name = "issues_app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "A Bevy desktop dashboard of open GitHub issues per hobby project, with one-click hcdev launch."

[[bin]]
name = "hgh-issues"
path = "src/main.rs"

[dependencies]
bevy.workspace = true
bevy_feathers.workspace = true
bevy_ui_widgets.workspace = true
# Reused from the hwt-overview tool rather than copied: `feathers_kit` is
# domain-agnostic by design and `hwt_core` holds the non-Bevy paths/process
# helpers this app needs verbatim. Same pattern as mcps/tree-extract depending
# into lsps/.
feathers_kit = { path = "../../../hwt-overview/crates/feathers_kit" }
hwt_core = { path = "../../../hwt-overview/crates/hwt_core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
