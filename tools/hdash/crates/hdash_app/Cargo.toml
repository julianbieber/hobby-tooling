[package]
# `hdash_app`, not `dash_app`: cargo tracks installs by package name in
# ~/.cargo/.crates2.json, so a generic name risks colliding with a future work crate
# and evicting its binaries on every `cargo install`.
name = "hdash_app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "A terminal dashboard of hobby work items: the tasks in the notes repo and their worktrees, PRs and Claude sessions."

[[bin]]
name = "hdash"
path = "src/main.rs"

[dependencies]
hwt_core = { path = "../hwt_core" }
log = "0.4"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-width = "0.2"
