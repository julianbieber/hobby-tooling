[package]
# `hdash_app`, not `dash_app`: cargo tracks installs by package name in
# ~/.cargo/.crates2.json, so a generic name risks colliding with a future work crate
# and evicting its binaries on every `cargo install`.
name = "hdash_app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "A terminal dashboard of hobby work items: the tasks in the notes repo and their worktrees, PRs and Claude sessions."

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hdash"
path = "src/main.rs"

[dependencies]
hwt_core.workspace = true
log.workspace = true
parking_lot.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
