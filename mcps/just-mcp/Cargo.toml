[package]
name = "hobby-just-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[lib]
name = "hobby_just_mcp"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hobby-just-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.11", default-features = false, features = ["base64", "macros", "server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
dirs = { version = "5", default-features = false }
ignore = { version = "0.4", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }

[dev-dependencies]
rmcp = { version = "0.11", default-features = false, features = ["base64", "macros", "server", "client", "transport-io"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"

[profile.release]
panic = "abort"
debug = "line-tables-only"
