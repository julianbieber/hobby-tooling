[package]
name = "hobby-just-mcp"
version = "0.1.0"
edition = "2024"

[lib]
name = "hobby_just_mcp"
path = "src/lib.rs"

[[bin]]
name = "hobby-just-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.11", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
dirs = "5"
ignore = "0.4"

[dev-dependencies]
rmcp = { version = "0.11", features = ["server", "client", "transport-io"] }
