[package]
name = "hobby-lsp-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "hobby_lsp_mcp"
path = "src/lib.rs"

[dependencies]
# MCP Server
rmcp = { version = "0.8", features = ["server", "macros", "transport-io"] }

# LSP Communication
tower-lsp = "0.20"
lsp-types = "0.95"
lsp-server = "0.7"

# Async Runtime
tokio = { version = "1.0", features = ["full", "process"] }

# Configuration & Serialization
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Fuzzy Matching
nucleo-matcher = "0.3"

# Caching
once_cell = "1.19"
