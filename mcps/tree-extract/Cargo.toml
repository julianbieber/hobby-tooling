[package]
name = "hobby-tree-extract"
version = "0.1.0"
edition = "2024"

[lib]
name = "hobby_tree_extract"
path = "src/lib.rs"

[[bin]]
name = "hobby-tree-extract"
path = "src/bin/hobby-tree-extract.rs"

[[bin]]
name = "hobby-tree-extract-mcp"
path = "src/bin/hobby-tree-extract-mcp.rs"

[dependencies]
# Reuse helix-language-registry + grammar cache from the existing LSP crate.
treesitter-class-lsp = { path = "../../lsps/treesitter-class-lsp" }

tree-sitter = "0.25"
streaming-iterator = "0.1"
ignore = "0.4"

# Code-graph query engine: petgraph for strongly-connected-component (cycle)
# detection, nucleo-matcher for fuzzy symbol search (same version the sibling
# LSP crate uses).
petgraph = "0.6"
nucleo-matcher = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# MCP
rmcp = { version = "0.11", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
