[package]
name = "hobby-tree-extract"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[lib]
name = "hobby_tree_extract"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hobby-tree-extract"
path = "src/bin/hobby-tree-extract.rs"

[[bin]]
name = "hobby-tree-extract-mcp"
path = "src/bin/hobby-tree-extract-mcp.rs"

[dependencies]
# Reuse helix-language-registry + grammar cache from the existing LSP crate.
treesitter-class-lsp = { path = "../../lsps/treesitter-class-lsp" }

tree-sitter = { version = "0.25", default-features = false }
streaming-iterator = { version = "0.1", default-features = false }
ignore = { version = "0.4", default-features = false }

# Code-graph query engine: petgraph for strongly-connected-component (cycle)
# detection, nucleo-matcher for fuzzy symbol search (same version the sibling
# LSP crate uses).
petgraph = { version = "0.6", default-features = false }
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
parking_lot = { version = "0.12", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

# CLI
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# MCP
rmcp = { version = "0.11", default-features = false, features = ["base64", "server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"

[profile.release]
panic = "abort"
debug = "line-tables-only"
