[package]
name = "hobby-research-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
name = "hobby_research_lsp"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hobby-research-lsp"
path = "src/main.rs"

[dependencies]
parking_lot = { version = "0.13", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "io-std", "macros", "process", "time"] }
tower-lsp = { version = "0.20", default-features = false, features = ["runtime-tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"

[profile.release]
panic = "abort"
debug = "line-tables-only"
