[package]
name = "hobby-research-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hobby-research-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
