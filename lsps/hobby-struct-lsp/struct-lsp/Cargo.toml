[package]
name = "hobby-struct-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hobby-struct-lsp"
path = "src/main.rs"

[dependencies]
struct-parser = { path = "../struct-parser", package = "hobby-struct-parser" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }

[dev-dependencies]
tempfile = "3"
