[package]
name = "hobby-struct-parser"
version = "0.1.0"
edition = "2024"

[lib]
name = "struct_parser"
path = "src/lib.rs"

[[bin]]
name = "hobby-struct-parser"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
