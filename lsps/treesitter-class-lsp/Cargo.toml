[package]
name = "treesitter-class-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

tree-sitter = "0.25"
streaming-iterator = "0.1"
libloading = "0.8"

ignore = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
nucleo-matcher = "0.3"
regex = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
