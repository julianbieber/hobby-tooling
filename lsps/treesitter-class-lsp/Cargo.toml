[package]
name = "treesitter-class-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"

[lib]
doctest = false

[dependencies]
tower-lsp = { version = "0.20", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "io-std", "fs", "sync"] }

tree-sitter = { version = "0.25", default-features = false, features = ["std"] }
streaming-iterator = { version = "0.1", default-features = false }
libloading = { version = "0.8", default-features = false }

ignore = { version = "0.4", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
parking_lot = { version = "0.12", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"
debug = "line-tables-only"
