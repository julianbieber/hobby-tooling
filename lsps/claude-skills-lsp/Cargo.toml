[package]
name = "claude_skills_lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "claude-skills-lsp"
path = "src/main.rs"

[lib]
name = "claude_skills_lsp"
path = "src/lib.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
nucleo-matcher = "0.3"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
