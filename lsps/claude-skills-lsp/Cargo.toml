[package]
name = "claude_skills_lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[[bin]]
name = "claude-skills-lsp"
path = "src/main.rs"

[lib]
name = "claude_skills_lsp"
path = "src/lib.rs"
doctest = false

[dependencies]
tower-lsp = { version = "0.20", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "io-std", "macros"] }
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }
ignore = { version = "0.4", default-features = false }
parking_lot = { version = "0.13", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"

[profile.release]
panic = "abort"
debug = "line-tables-only"
